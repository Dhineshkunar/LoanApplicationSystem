spring:
  application:
    name: loan-approval-system

  profiles:
    active: dev   # override with -Dspring.profiles.active=prod at deploy time

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  error:
    include-message: never    # our GlobalExceptionHandler owns the error body, not Spring Boot's default
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info    # Actuator: expose only what's needed, never "*" in production

logging:
  level:
    root: INFO
    com.loanapp: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# ---------- DEV / DEMO PROFILE: in-memory H2, for local runs & interviews ----------
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:file:./data/loandb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update      # fine for demo; see prod profile for the production-safe approach
    show-sql: true
    properties:
      hibernate:
        format_sql: true

